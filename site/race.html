<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Race chart - Rides dashboard</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header>
    <h1>Rides dashboard</h1>
    <nav><a href="./index.html">Home</a><a href="./race.html">Race chart</a></nav>
  </header>
  <main>
    <section>
      <h2>Cumulative rides by city</h2>
      <p id="date">Loading data&hellip;</p>
      <p id="leader"></p>
      <div id="controls" class="race-controls" hidden>
        <button id="toggle" type="button">Pause</button>
        <input id="scrubber" type="range" min="0" step="1" value="0" aria-label="Date">
      </div>
      <div id="race" class="race" role="img" aria-label="Race chart of cumulative rides by city"></div>
      <table id="final-rides" class="race-final" hidden>
        <caption>Final cumulative rides by city</caption>
        <thead><tr><th>City</th><th>Rides</th></tr></thead>
        <tbody></tbody>
      </table>
    </section>
  </main>
  <script type="module">
    import { parseCsv } from "./src/csv.js";
    import { raceFrames } from "./src/race.js";

    const FRAME_MS = 100;
    const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

    const response = await fetch("./data/rides.csv");
    const { frames, max } = raceFrames(parseCsv(await response.text()));

    const dateEl = document.getElementById("date");
    const leaderEl = document.getElementById("leader");
    const race = document.getElementById("race");
    const finalRidesTable = document.getElementById("final-rides");
    const controls = document.getElementById("controls");
    const toggle = document.getElementById("toggle");
    const scrubber = document.getElementById("scrubber");
    const formatDate = (date) =>
      new Date(date).toLocaleDateString(undefined, { day: "numeric", month: "long", year: "numeric", timeZone: "UTC" });

    // One row per city, kept for the whole run so bar widths can transition.
    const rowByCity = new Map();
    function rowFor(city) {
      if (!rowByCity.has(city)) {
        const row = document.createElement("div");
        row.className = "race-row";
        row.innerHTML = `<span class="race-city"></span><span class="race-track"><span class="race-bar"></span></span><span class="race-rides"></span>`;
        row.querySelector(".race-city").textContent = city;
        race.appendChild(row);
        rowByCity.set(city, row);
      }
      return rowByCity.get(city);
    }

    function leaderLabel({ cities, leader, lead }) {
      if (leader === null) return "The top cities are tied";
      if (lead === null) return `${leader} leads`;
      return `${leader} leads ${cities[1].city} by ${lead.toLocaleString()} ${lead === 1 ? "ride" : "rides"}`;
    }

    function show(frame) {
      dateEl.textContent = formatDate(frame.date);
      leaderEl.textContent = leaderLabel(frame);
      frame.cities.forEach(({ city, rides }, rank) => {
        const row = rowFor(city);
        row.style.order = rank;
        row.querySelector(".race-bar").style.width = `${max ? (rides / max) * 100 : 0}%`;
        row.querySelector(".race-rides").textContent = rides.toLocaleString();
      });
    }

    if (frames.length === 0) {
      dateEl.textContent = "No ride data.";
      race.hidden = true;
    } else {
      // With reduced motion, open on the final frame and wait to be asked to play.
      let index = reducedMotion ? frames.length - 1 : 0;
      let timer = null; // set while playing
      const atEnd = () => index === frames.length - 1;

      function render() {
        show(frames[index]);
        scrubber.value = index;
        scrubber.setAttribute("aria-valuetext", formatDate(frames[index].date));
        toggle.textContent = timer ? "Pause" : atEnd() ? "Replay" : "Play";
      }

      function pause() {
        clearInterval(timer);
        timer = null;
      }

      function play() {
        timer = setInterval(() => {
          if (!atEnd()) index += 1;
          if (atEnd()) pause();
          render();
        }, FRAME_MS);
      }

      toggle.addEventListener("click", () => {
        if (timer) {
          pause();
        } else {
          if (atEnd()) index = 0;
          play();
        }
        render();
      });

      scrubber.addEventListener("input", () => {
        pause();
        index = Number(scrubber.value);
        render();
      });

      // Grabbing the thumb changes no value yet, so pause before the first move.
      scrubber.addEventListener("pointerdown", () => {
        pause();
        render();
      });

      for (const { city, rides } of frames.at(-1).cities) {
        const tr = finalRidesTable.tBodies[0].insertRow();
        tr.insertCell().textContent = city;
        tr.insertCell().textContent = rides.toLocaleString();
      }
      finalRidesTable.hidden = false;

      race.style.setProperty("--frame-ms", `${FRAME_MS}ms`);
      scrubber.max = frames.length - 1;
      controls.hidden = false;
      if (!atEnd()) play();
      render();
    }
  </script>
</body>
</html>
